<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Treeco Flooring Inventory</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;500;700&display=swap');
    :root{font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;color:#154734;background:#f7f7f6}*{box-sizing:border-box}body{margin:0}.brandbar{height:8px;background:#d79133}.site-header{background:#154734;color:#fff}.header-inner{max-width:1280px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:190px;height:auto;display:block}.logo-dark{display:none}.header-note{font-size:14px;letter-spacing:.04em;color:#e5e5e6}.wrap{max-width:1280px;margin:auto;padding:44px 24px 64px}.eyebrow{color:#d79133;font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:8px 0 26px}.top h1{font:700 clamp(36px,5vw,58px)/.95 'Bebas Neue',Impact,sans-serif;letter-spacing:.02em;margin:0;color:#154734}.count{color:#4c4e56;font-size:15px}.search{background:white;border:2px solid #e5e5e6;border-radius:3px;padding:15px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 16px #15473412;margin-bottom:10px}.search:focus-within{border-color:#d79133}.search-icon{font-size:22px;color:#d79133}.search input{border:0;outline:0;width:100%;font:400 18px 'Roboto Condensed',Arial,sans-serif;background:transparent;color:#154734}.branch-toggle{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;color:#4c4e56;font-size:15px;cursor:pointer}.branch-toggle input{accent-color:#154734;width:16px;height:16px}.table-wrap{background:#fff;border:1px solid #e5e5e6;border-radius:3px;overflow:auto;box-shadow:0 5px 16px #1547340c}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:15px 16px;border-bottom:1px solid #e5e5e6;white-space:nowrap}th{background:#154734;color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0}td{font-size:16px;color:#4c4e56}tbody tr:hover{background:#fff9f1}td:first-child{font-weight:700;color:#154734}td:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}.empty{padding:40px;text-align:center;color:#4c4e56}@media(max-width:700px){.header-inner{padding:16px 14px}.logo{width:155px}.header-note{font-size:12px}.wrap{padding:32px 14px 48px}.top{display:block}.count{display:block;margin-top:10px}}
  </style>
</head>
<body><div class="brandbar"></div><header class="site-header"><div class="header-inner"><img class="logo" src="/assets/treeco-logo-white.png" alt="Treeco"><div class="header-note">Hardwood flooring experts since 1996</div></div></header><main class="wrap"><div class="eyebrow">Treeco Flooring</div><div class="top"><h1>Available inventory</h1><div class="count" id="count">Loading inventory…</div></div><label class="search"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Search by SKU, description, or collection…" autocomplete="off"></label><label class="branch-toggle"><input id="showBranches" type="checkbox"> Show branch stock</label><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>No matching flooring found.</div></div></main>
<script>
const search=document.querySelector('#search'), head=document.querySelector('#head'), body=document.querySelector('#body'), count=document.querySelector('#count'), empty=document.querySelector('#empty'), showBranches=document.querySelector('#showBranches');let data=[];
function render(){const q=search.value.toLowerCase().trim();const rows=data.filter(p=>p.sku.toLowerCase().includes(q)||p.description.toLowerCase().includes(q)||p.collection.toLowerCase().includes(q)).sort((a,b)=>Number(b.total_stock||0)-Number(a.total_stock||0));count.textContent=`${rows.length} of ${data.length} products`;const branchHeaders=showBranches.checked?Object.keys(rows[0]?.branches||{}).map(b=>`<th>${esc(b)}</th>`).join(''):'';head.innerHTML=`<tr><th>SKU</th><th>Description</th><th>Total stock</th>${branchHeaders}</tr>`;body.innerHTML=rows.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.description)}</td><td>${stockText(p,p.total_stock)}</td>${showBranches.checked?Object.values(p.branches).map(v=>`<td>${stockText(p,v)}</td>`).join(''):''}</tr>`).join('');empty.hidden=rows.length>0}
function fmt(v){return Number(v||0).toLocaleString()}function stockText(p,boxes){const bx=Number(boxes||0);return p.carton_sqft?`${fmt(Math.round(bx*p.carton_sqft))}sqft. (${fmt(bx)}bx.)`:`${fmt(bx)}bx.`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}search.addEventListener('input',render);showBranches.addEventListener('change',render);fetch('/api/inventory').then(r=>r.json()).then(x=>{data=x.products;render()}).catch(()=>{count.textContent='Inventory unavailable';empty.hidden=false;empty.textContent='Could not load inventory.db.'});
</script></body></html>
