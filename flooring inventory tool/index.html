<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Treeco Flooring Inventory</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17221d;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:42px 24px}.eyebrow{color:#63816d;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:8px 0 26px}.top h1{font:700 clamp(28px,4vw,48px)/1.05 Georgia,serif;margin:0}.count{color:#64706a;font-size:14px}.search{background:white;border:1px solid #dbe2dc;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #2035280b;margin-bottom:18px}.search input{border:0;outline:0;width:100%;font-size:16px;background:transparent}.table-wrap{background:#fff;border:1px solid #dbe2dc;border-radius:14px;overflow:auto;box-shadow:0 8px 24px #2035280b}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf0ed;white-space:nowrap}th{background:#edf3ed;color:#50645a;font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0}td:first-child{font-weight:700;color:#31573f}td:nth-child(n+4){text-align:right;font-variant-numeric:tabular-nums}.empty{padding:40px;text-align:center;color:#78847c}@media(max-width:700px){.wrap{padding:28px 14px}.top{display:block}.count{display:block;margin-top:10px}}
  </style>
</head>
<body><main class="wrap"><div class="eyebrow">Treeco Flooring</div><div class="top"><h1>Available inventory</h1><div class="count" id="count">Loading inventory…</div></div><label class="search">⌕<input id="search" type="search" placeholder="Search by SKU or description…" autocomplete="off"></label><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>No matching flooring found.</div></div></main>
<script>
const search=document.querySelector('#search'), head=document.querySelector('#head'), body=document.querySelector('#body'), count=document.querySelector('#count'), empty=document.querySelector('#empty');let data=[];
function render(){const q=search.value.toLowerCase().trim();const rows=data.filter(p=>p.sku.toLowerCase().includes(q)||p.description.toLowerCase().includes(q)||p.collection.toLowerCase().includes(q));count.textContent=`${rows.length} of ${data.length} products`;body.innerHTML=rows.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.description)}</td><td>${esc(p.collection)}</td><td>${fmt(p.total_stock)}</td>${Object.values(p.branches).map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`).join('');empty.hidden=rows.length>0}
function fmt(v){return Number(v||0).toLocaleString()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}search.addEventListener('input',render);fetch('/api/inventory').then(r=>r.json()).then(x=>{data=x.products;head.innerHTML=`<tr><th>SKU</th><th>Description</th><th>Collection</th><th>Total stock</th>${x.branches.map(b=>`<th>${esc(b)}</th>`).join('')}</tr>`;render()}).catch(()=>{count.textContent='Inventory unavailable';empty.hidden=false;empty.textContent='Could not load inventory.db.'});
</script></body></html>
